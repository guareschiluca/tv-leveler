name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard against accidental npm dependencies
        run: |
          if [ -f package.json ] || [ -f package-lock.json ] || [ -d node_modules ]; then
            echo "::error::This project is intentionally dependency-free (plain HTML/CSS/JS + CDN Bootstrap)." >&2
            echo "::error::Found an npm project file/folder that shouldn't be here. Remove it." >&2
            exit 1
          fi

      - name: Run unit tests
        run: node --test
